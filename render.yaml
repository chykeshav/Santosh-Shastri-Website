services:
  # ── Backend (Node/Express + SQLite) ────────────────────────────────────────
  - type: web
    name: santoshshastri-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: SQLITE_DB_PATH
        value: /app/database/bookings.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false          # Set in Render dashboard → do not commit
      - key: SMTP_PASS
        sync: false          # Set in Render dashboard → do not commit
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false          # Set to your Render frontend URL after deploying

  # ── Frontend (React + Vite, served via Nginx) ────────────────────────────
  - type: web
    name: santoshshastri-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_BACKEND_URL
        sync: false          # Set to your Render backend URL after deploying
